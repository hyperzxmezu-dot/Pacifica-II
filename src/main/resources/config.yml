config-version: 4
plugin:
  enabled: true
  debug: false
integrations:
  placeholderapi: true
  luckperms: true
tab:
  enabled: true
  update-period-ticks: 20
  header:
    - '<#FFFFFF>&m                                                </#FFFF00>'
    - '&6✬ &8&lDistrict&4&lX &6&lNetwork &6✬'
    - ''
    - '&6▶ &7You are currently in: &2&l&nPACIFICA II &7(&2&l&nRoleplay City&r &r/ &2&l&nGTA&7) &6◀'
    - ''
    - '&7Player Online &a&n%online%'
    - ''
  footer:
    - ''
    - '&8&lDistrict&4&lX &7➟ &6&lv1.0'
    - '&r⇒ &2&l&oC&d&l&oh&6&l&oi&3&l&ol&b&l&ol&5&l&oi&e&l&on &f&l&ol&9&l&oi&6&l&ok &2&l&oe &3&l&oa &d&l&oi&b&l&ol&f&l&ol&9&l&oa&e&l&oi&b&l&on &r&f⇐'
    - ''
    - '<#FFFFFF>&m                                                </#FFFF00>'
  player-name-format: '%luckperms_prefix%%tag%%name%%suffix%'
  fallback-prefix: ''
  fallback-suffix: ''
  luckperms:
    enabled: true
motd:
  server-list:
    enabled: true
  Server-MOTD:
    Line-1: '    &6✬ &8&lDistrict&4&lX &6&lNetwork &8[ &a&lx1.21.8 Only&8 ]&6✬'
    Line-2: '   &7&l&k|&f&l&k|&r &8► &2&lPACIFICA II &7(&2&l&nRoleplay City&r&r/ &2&l&nGTA&7) &8◄ &f&l&k|&7&l&k|'
moderation:
  anti-chat:
    block-repeated-messages: true
    blocked-patterns:
      - '(?i)https?://'
      - '(?i)discord\\.gg'
      - '(?i)join\\s+now'
  help:
    header: '&6&lHelp'
    pages:
      1:
        - '&e/spawn &7- Teleport to spawn.'
        - '&e/warp &7- Teleport to a random warp.'
        - '&e/taxi &7- Open the taxi menu.'
        - '&e/ct &7- Check CombatTag status.'
protection:
  protected-items:
    - CHEST
    - COMPASS
    - CLOCK
  weapons:
    crackshot: []
    weaponmechanics: []
    minecraft: []
jobs:
  default: CRIMINAL
  death-cooldown:
    enabled: true
    duration: 3h
    perks:
      tier-1:
        permission: pacifica.jobmode.delay.1
        duration: 2h
      tier-2:
        permission: pacifica.jobmode.delay.2
        duration: 1h
      tier-3:
        permission: pacifica.jobmode.delay.3
        duration: 30m
  unlocks:
    cop:
      level: 25
    hitman:
      level: 40
    medic:
      level: 0
  npcs:
    cop: cop_npc
    hitman: hitman_npc
    medic: medic_npc
    criminal-quit: criminal_npc
    warden: warden_npc
  messages:
    selected: '&aYou are now a %job%.'
    already-active: '&eYou already have that job.'
    level-required: '&cYou have not reached the level required for that job.'
    cooldown: '&cYou cannot select that job yet.'
    no-permission: '&cYou do not have permission for that job.'
    cancelled: '&cThat job change was cancelled.'
    failed: '&cYou could not select that job.'
    quit: '&aYou are now a CRIMINAL.'
    medic-coming-soon: '&eThe Medic job is coming soon.'
  cop:
    arrest:
      taser:
        material: BLAZE_ROD
        name: '&bTaser'
      night-stick:
        material: STICK
        hits: 3
        window: 8s
    arrest-rewards:
      1: 1000
      2: 2500
      3: 5000
      4: 10000
      5: 20000
    bribe:
      enabled: true
      minimum: 5000
      expiration: 2m
  cop:
    arrest:
      taser:
        material: BLAZE_ROD
        name: '&bTaser'
      night-stick:
        material: STICK
        hits: 3
        window: 8s
    arrest-rewards:
      1: 1000
      2: 2500
      3: 5000
      4: 10000
      5: 20000
    bribe:
      enabled: true
      minimum: 5000
      expiration: 2m
wanted:
  enabled: true
  max-stars: 5
  placeholder:
    enabled: true
  kill-thresholds:
    1: 1
    2: 2
    4: 3
    5: 4
    6: 5
  cop-kill:
    stars: 2
  decay:
    enabled: true
    interval: 60m
    amount: 1
  warden:
    enabled: true
    price-per-star: 10000
    messages:
      not-wanted: '&eYou have no wanted stars.'
      insufficient-funds: '&cYou cannot afford to clear your wanted stars.'
      remove-one-success: '&aYou paid $%cost% to remove one wanted level. %level% remaining.'
      success: '&aYou paid $%cost% to clear your wanted stars.'
  protected-npcs: []
  npc-kill-stars: 1
jail:
  enabled: true
  durations:
    1: 25m
    2: 30m
    3: 45m
    4: 60m
    5: 80m
  restriction:
    radius: 15
  allowed-commands:
    - bribe
bounty:
  max-reward: 1000000
  player-placement:
    minimum: 1
    maximum: 1000000
    anonymous-default: true
  random:
    enabled: true
    interval: 30m
    minimum: 10000
    maximum: 1000000
    exclude-operators: true
    excluded-permission: pacifica.bounty.random.bypass
    excluded-players: []
  broadcast:
    enabled: true
  head-drop:
    enabled: true
    chance-percent: 0.10
    broadcast: false
medic:
  range: 4
  cooldown: 30s
  allow-self: false
  syringe:
    material: POTION
    name: '&dMedic Syringe'
  kit-effects:
    tank: []
    flash: []
    pillow: []
    breath: []
  debuffs:
    duration: 10s
    amplifier: 0
    effects:
      - SLOWNESS
      - WEAKNESS
      - HUNGER
  rewards:
    tank: 1000
    flash: 1000
    pillow: 1000
    breath: 1000