name: Pacifica-II
version: 1.21.8
main: com.districtx.pacifica.PacificaPlugin
api-version: '1.21'
author: DistrictX Developers Official
softdepend:
  - Vault
  - Pacifica-Core
  - Essentials
  - EssentialsX
  - CrackShot
  - WeaponMechanics
  - LuckPerms
  - PlaceholderAPI
  - Pacifica-Housing
commands:
  spawn:
    description: Teleport to spawn through the taxi system.
  warp:
    description: Teleport to a random configured warp.
  taxi:
    description: Open the taxi menu.
  trashcan:
    description: Open a trash can.
    aliases:
      - trash
  tpa:
    description: Send a teleport request.
  tpaccept:
    description: Accept a teleport request.
  tpdeny:
    description: Deny a teleport request.
  tpcancel:
    description: Cancel your outgoing teleport request.
  ct:
    description: Show your current CombatTag status.
  gms:
    description: Change your gamemode to Survival.
    permission: pacifica.gamemode.survival
  gma:
    description: Change your gamemode to Adventure.
    permission: pacifica.gamemode.adventure
  gmc:
    description: Change your gamemode to Creative.
    permission: pacifica.gamemode.creative
  gmsp:
    description: Change your gamemode to Spectator.
    permission: pacifica.gamemode.spectator
  heal:
    description: Restore health and hunger.
    permission: pacifica.essentials.heal
  feed:
    description: Restore hunger.
    permission: pacifica.essentials.feed
  invsee:
    description: View a player's inventory.
    usage: /invsee <player>
    permission: pacifica.essentials.invsee
  afk:
    description: Toggle your AFK status.
    permission: pacifica.essentials.afk
  ec:
    description: Open your Ender Chest.
    aliases:
      - enderchest
    permission: pacifica.essentials.enderchest
  bribe:
    description: Offer a bribe or respond to a prisoner's offer.
    usage: /bribe <amount|accept|deny> [prisoner]
  bountytrack:
    description: Track a player with an active bounty.
    usage: /bountytrack <player|clear>
  tag:
    description: Manage your equipped cosmetic tag.
    aliases:
      - tags
    usage: /tag
  adminpii:
    description: Centralized Pacifica-II administrative command.
    usage: /adminpii <spawn|warp|taxi|trash|jail|job|tag|supplydrop|reload> ...
  supply:
    description: View and summon your available supply drops.
    usage: /supply
permissions:
  pacifica.adminpii:
    default: op
    children:
      pacifica.adminpii.spawn: true
      pacifica.adminpii.warp: true
      pacifica.adminpii.taxi: true
      pacifica.adminpii.trash: true
      pacifica.adminpii.jail: true
      pacifica.adminpii.job: true
      pacifica.adminpii.tag: true
      pacifica.adminpii.supplydrop: true
      pacifica.adminpii.reload: true
  pacifica.adminpii.spawn:
    default: op
  pacifica.adminpii.warp:
    default: op
  pacifica.adminpii.taxi:
    default: op
  pacifica.adminpii.trash:
    default: op
  pacifica.adminpii.jail:
    default: op
  pacifica.adminpii.job:
    default: op
